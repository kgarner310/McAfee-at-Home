version: '3.8'

services:
  dns-shield:
    build:
      context: .
      dockerfile: Dockerfile.dns
    container_name: mcafee-dns-shield
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      - LISTEN_ADDR=0.0.0.0:53
      - UPSTREAM_DNS=8.8.8.8:53,1.1.1.1:53
      - CACHE_SIZE=10000
      - LOG_LEVEL=info
    volumes:
      - ./config/blocklists.json:/app/config/blocklists.json:ro
      - ./config/whitelist.txt:/app/config/whitelist.txt:ro
      - ./data/dns_logs:/app/logs
    restart: unless-stopped
    networks:
      - mcafee-net

  antivirus:
    build:
      context: .
      dockerfile: Dockerfile.antivirus
    container_name: mcafee-antivirus
    ports:
      - "3310:3310/tcp"
    environment:
      - CLAMD_PORT=3310
      - LOG_LEVEL=info
      - MAX_SCAN_SIZE=104857600
    volumes:
      - ./data/quarantine:/app/quarantine
      - ./data/av_logs:/app/logs
      - /var/run/clamav:/var/run/clamav
    restart: unless-stopped
    networks:
      - mcafee-net

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcafee-dashboard
    ports:
      - "8080:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_DNS_STATS_API=http://localhost:8000/api/dns
    depends_on:
      - api-server
    restart: unless-stopped
    networks:
      - mcafee-net

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mcafee-api
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - DNS_SHIELD_HOST=dns-shield
      - ANTIVIRUS_HOST=antivirus
      - ANTIVIRUS_PORT=3310
      - LOG_LEVEL=info
    volumes:
      - ./config:/app/config:ro
      - ./data/api_logs:/app/logs
      - /var/run/clamav:/var/run/clamav
    depends_on:
      - dns-shield
      - antivirus
    restart: unless-stopped
    networks:
      - mcafee-net

networks:
  mcafee-net:
    driver: bridge
